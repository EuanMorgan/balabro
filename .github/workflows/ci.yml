name: CI

on:
  push:
  pull_request:

jobs:
  mac:
    # Xcode 26 ships Swift 6.2 or newer.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - run: swift build
      - run: swift test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/Balabro.Windows.sln
      - name: Package
        shell: pwsh
        run: scripts/make-windows.ps1 0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Balabro-0.0.0-ci.${{ github.run_number }}-windows-x64
          path: dist/Balabro-0.0.0-ci.${{ github.run_number }}-windows-x64.zip
          if-no-files-found: error
